<div class="repo-container">

  <h1>Repositorios</h1>
  <p class="subtitle">Explora proyectos disponibles</p>

  <div class="repo-grid">

    <div class="repo-card" *ngFor="let repo of repositorios">
    <div class="poster-card" *ngIf="repo.name && repo.name.length > 0" [routerLink]="['/repositorio', repo.id]">
      
      <h3>{{ repo.name }}</h3>

      <p>{{ repo.language }}</p>

    </div>

  </div>

</div>
